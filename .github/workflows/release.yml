name: Build Windows Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (MAJOR.MINOR.PATCH)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
      - name: Install Build Dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Test Installer
        run: powershell -NoProfile -File scripts/test_installer.ps1
      - name: Build
        run: python -m PyInstaller --noconfirm --windowed --onedir --name SafeLoad --collect-all pymupdf app.py
      - name: Package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/package_release.py --version "$env:RELEASE_VERSION"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release create "v$env:RELEASE_VERSION" dist/SafeLoad-Windows-x64.zip dist/SafeLoad-Windows-x64.zip.sha256 --target "${{ github.sha }}" --title "SafeLoad $env:RELEASE_VERSION" --generate-notes
